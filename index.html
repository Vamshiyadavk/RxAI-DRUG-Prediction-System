<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RxAI — AI Clinical Drug Prediction & Decision Support</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@300;400;500;600&display=swap" rel="stylesheet" />

  <!-- React 18 + Babel (Zero-build client-side reactivity) -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<style>
/* ═══════════════════════════════════════════
   DESIGN TOKENS & THEME VARIABLES
═══════════════════════════════════════════ */
:root {
  --c-bg          : #f4f6fb;
  --c-surface     : #ffffff;
  --c-surface2    : #f8f9ff;
  --c-surface3    : #edf2f9;
  --c-border      : #e2e8f0;
  --c-border2     : #cbd5e1;
  --c-primary     : #4f46e5;
  --c-primary-l   : #6366f1;
  --c-primary-d   : #3730a3;
  --c-accent      : #06b6d4;
  --c-accent-soft : #e0f2fe;
  --c-success     : #059669;
  --c-success-bg  : #ecfdf5;
  --c-warning     : #d97706;
  --c-warning-bg  : #fffbeb;
  --c-danger      : #dc2626;
  --c-danger-bg   : #fef2f2;
  --c-info        : #2563eb;
  --c-info-bg     : #eff6ff;
  --c-text        : #0f172a;
  --c-text2       : #475569;
  --c-text3       : #64748b;
  --c-text4       : #94a3b8;
  --mono          : 'JetBrains Mono', monospace;
  --sans          : 'Outfit', sans-serif;
  --radius        : 14px;
  --radius-lg     : 20px;
  --radius-xl     : 28px;
  --shadow        : 0 1px 3px rgba(15,23,42,.06), 0 4px 16px rgba(79,70,229,.06);
  --shadow-lg     : 0 4px 6px rgba(15,23,42,.06), 0 12px 40px rgba(79,70,229,.1);
  --modal-overlay : rgba(15, 23, 42, 0.6);
}

[data-theme="dark"] {
  --c-bg          : #0b0f19;
  --c-surface     : #121929;
  --c-surface2    : #172138;
  --c-surface3    : #1e2b48;
  --c-border      : #1e293b;
  --c-border2     : #334155;
  --c-primary     : #6366f1;
  --c-primary-l   : #818cf8;
  --c-primary-d   : #4f46e5;
  --c-accent      : #22d3ee;
  --c-accent-soft : #164e63;
  --c-success     : #10b981;
  --c-success-bg  : #064e3b;
  --c-warning     : #f59e0b;
  --c-warning-bg  : #451a03;
  --c-danger      : #f87171;
  --c-danger-bg   : #450a0a;
  --c-info        : #3b82f6;
  --c-info-bg     : #172554;
  --c-text        : #f8fafc;
  --c-text2       : #cbd5e1;
  --c-text3       : #94a3b8;
  --c-text4       : #64748b;
  --shadow        : 0 2px 8px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.45);
  --shadow-lg     : 0 8px 24px rgba(0,0,0,.5), 0 20px 48px rgba(0,0,0,.6);
  --modal-overlay : rgba(0, 0, 0, 0.75);
}

/* ═══════════════════════════════════════════
   BASE & RESET
═══════════════════════════════════════════ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: var(--sans);
  background: var(--c-bg);
  color: var(--c-text);
  min-height: 100vh;
  line-height: 1.6;
  transition: background-color .25s ease, color .25s ease;
}
::-webkit-scrollbar { width: 7px; height: 7px; }
::-webkit-scrollbar-track { background: var(--c-bg); }
::-webkit-scrollbar-thumb { background: var(--c-border2); border-radius: 4px; }

/* ═══════════════════════════════════════════
   NAVBAR
═══════════════════════════════════════════ */
.navbar {
  background: var(--c-surface);
  border-bottom: 1px solid var(--c-border);
  position: sticky; top: 0; z-index: 100;
  box-shadow: 0 1px 3px rgba(0,0,0,.04);
  backdrop-filter: blur(12px);
}
.navbar-inner {
  max-width: 1240px; margin: 0 auto;
  padding: 0 24px; height: 66px;
  display: flex; align-items: center; justify-content: space-between;
}
.logo {
  font-size: 1.4rem; font-weight: 800;
  letter-spacing: -0.03em; color: var(--c-primary);
  display: flex; align-items: center; gap: 10px;
  text-decoration: none;
}
.logo-icon {
  width: 38px; height: 38px; border-radius: 10px;
  background: linear-gradient(135deg, var(--c-primary), var(--c-accent));
  display: flex; align-items: center; justify-content: center;
  font-size: 20px; box-shadow: 0 4px 12px rgba(79,70,229,.25);
}
.logo-text { color: var(--c-text); }
.logo-text span { color: var(--c-primary); }

.nav-actions {
  display: flex; align-items: center; gap: 12px;
}
.btn-nav {
  font-family: var(--sans); font-size: 13px; font-weight: 500;
  background: var(--c-surface2); color: var(--c-text2);
  border: 1px solid var(--c-border);
  padding: 7px 14px; border-radius: 8px;
  cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
  transition: all .2s;
}
.btn-nav:hover {
  background: var(--c-surface3);
  color: var(--c-text);
  border-color: var(--c-primary-l);
}
.navbar-badge {
  font-family: var(--mono); font-size: 11px;
  background: var(--c-surface2); color: var(--c-primary);
  border: 1px solid var(--c-border);
  padding: 6px 14px; border-radius: 100px;
  font-weight: 500;
}
.theme-toggle-btn {
  width: 38px; height: 38px; border-radius: 9px;
  background: var(--c-surface2); border: 1px solid var(--c-border);
  color: var(--c-text); cursor: pointer; display: flex;
  align-items: center; justify-content: center; font-size: 18px;
  transition: all .2s;
}
.theme-toggle-btn:hover {
  background: var(--c-surface3);
  transform: rotate(15deg);
}

/* ═══════════════════════════════════════════
   HERO SECTION
═══════════════════════════════════════════ */
.hero {
  background: linear-gradient(170deg, var(--c-surface) 0%, var(--c-bg) 100%);
  border-bottom: 1px solid var(--c-border);
  padding: 56px 24px 44px;
  text-align: center;
}
.hero-pill {
  display: inline-flex; align-items: center; gap: 8px;
  font-family: var(--mono); font-size: 11px; letter-spacing: .08em;
  text-transform: uppercase; color: var(--c-primary);
  background: var(--c-surface2); border: 1px solid var(--c-border);
  padding: 6px 16px; border-radius: 100px; margin-bottom: 18px;
  box-shadow: 0 1px 4px rgba(0,0,0,.04);
}
.hero-pill-dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--c-success);
  animation: pulse 2s ease-in-out infinite;
}
@keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.4;transform:scale(.8)} }
.hero h1 {
  font-size: clamp(2rem, 4.5vw, 3.2rem);
  font-weight: 800; letter-spacing: -0.04em;
  line-height: 1.15; margin-bottom: 14px;
  color: var(--c-text);
}
.hero h1 em {
  font-style: normal;
  background: linear-gradient(135deg, var(--c-primary), var(--c-accent));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.hero p {
  font-size: 1.05rem; color: var(--c-text2);
  max-width: 580px; margin: 0 auto 30px; font-weight: 400;
}
.stat-row {
  display: inline-flex; gap: 0;
  border: 1px solid var(--c-border);
  border-radius: var(--radius-lg);
  background: var(--c-surface);
  overflow: hidden;
  box-shadow: var(--shadow);
}
.stat-item {
  padding: 12px 26px; text-align: center;
  border-right: 1px solid var(--c-border);
}
.stat-item:last-child { border-right: none; }
.stat-val {
  font-family: var(--mono); font-size: 1.35rem; font-weight: 600;
  color: var(--c-primary); display: block; line-height: 1.1;
}
.stat-lbl {
  font-size: 11px; color: var(--c-text3);
  text-transform: uppercase; letter-spacing: .08em;
}

/* ═══════════════════════════════════════════
   PRESETS BAR
═══════════════════════════════════════════ */
.presets-section {
  max-width: 1240px; margin: 26px auto 0;
  padding: 0 24px;
}
.presets-wrapper {
  background: var(--c-surface);
  border: 1px solid var(--c-border);
  border-radius: var(--radius);
  padding: 14px 18px;
  display: flex; align-items: center; gap: 12px;
  flex-wrap: wrap; box-shadow: var(--shadow);
}
.presets-label {
  font-family: var(--mono); font-size: 11px; font-weight: 600;
  text-transform: uppercase; letter-spacing: .08em;
  color: var(--c-text3); display: flex; align-items: center; gap: 6px;
}
.preset-chip {
  font-family: var(--sans); font-size: 12px; font-weight: 500;
  background: var(--c-surface2); color: var(--c-text2);
  border: 1px solid var(--c-border);
  padding: 6px 12px; border-radius: 8px; cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px;
  transition: all .2s;
}
.preset-chip:hover {
  background: var(--c-surface3);
  color: var(--c-primary);
  border-color: var(--c-primary-l);
  transform: translateY(-1px);
}
.preset-chip.random {
  background: linear-gradient(135deg, rgba(79,70,229,.1), rgba(6,182,212,.1));
  color: var(--c-primary);
  border-color: var(--c-primary-l);
}

/* ═══════════════════════════════════════════
   MAIN GRID
═══════════════════════════════════════════ */
.page-wrap {
  max-width: 1240px; margin: 24px auto 60px;
  padding: 0 24px;
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 28px;
}
@media (max-width: 900px) {
  .page-wrap { grid-template-columns: 1fr; }
  .stat-row { flex-wrap: wrap; }
}

.card {
  background: var(--c-surface);
  border: 1px solid var(--c-border);
  border-radius: var(--radius-xl);
  overflow: hidden;
  box-shadow: var(--shadow-lg);
  display: flex; flex-direction: column;
}
.card-head {
  padding: 22px 26px;
  border-bottom: 1px solid var(--c-border);
  display: flex; align-items: center; justify-content: space-between;
  background: var(--c-surface);
}
.card-head-left {
  display: flex; align-items: center; gap: 14px;
}
.card-head-icon {
  width: 42px; height: 42px; border-radius: 12px;
  background: var(--c-surface2); border: 1px solid var(--c-border);
  display: flex; align-items: center; justify-content: center;
  font-size: 20px;
}
.card-head-title {
  font-size: 1.15rem; font-weight: 700; color: var(--c-text);
}
.card-head-sub {
  font-family: var(--mono); font-size: 11px; color: var(--c-text3);
}
.card-body {
  padding: 26px; display: flex; flex-direction: column; gap: 20px;
  flex: 1;
}

/* ═══════════════════════════════════════════
   FORM FIELDS
═══════════════════════════════════════════ */
.field-row {
  display: grid; grid-template-columns: 1fr 1fr; gap: 16px;
}
.field {
  display: flex; flex-direction: column; gap: 8px;
}
.field-label {
  font-size: 12px; font-weight: 600; text-transform: uppercase;
  letter-spacing: .06em; color: var(--c-text2);
}
.field-input {
  font-family: var(--mono); font-size: 14px;
  background: var(--c-surface2); color: var(--c-text);
  border: 1px solid var(--c-border);
  border-radius: 10px; padding: 11px 14px;
  outline: none; transition: border-color .2s;
}
.field-input:focus {
  border-color: var(--c-primary);
  background: var(--c-surface);
  box-shadow: 0 0 0 3px rgba(79,70,229,.12);
}

.toggle-row {
  display: flex; gap: 8px; height: 44px;
}
.toggle-btn {
  flex: 1; background: var(--c-surface2);
  border: 1px solid var(--c-border);
  border-radius: 10px; font-family: var(--sans);
  font-size: 13px; font-weight: 600; color: var(--c-text2);
  cursor: pointer; transition: all .2s;
}
.toggle-btn:hover { background: var(--c-surface3); }
.toggle-btn.on {
  background: var(--c-primary); color: #ffffff;
  border-color: var(--c-primary);
  box-shadow: 0 3px 10px rgba(79,70,229,.3);
}

.select-wrap { position: relative; }
.field-select {
  width: 100%; appearance: none;
  font-family: var(--mono); font-size: 13px; font-weight: 500;
  background: var(--c-surface2); color: var(--c-text);
  border: 1px solid var(--c-border);
  border-radius: 10px; padding: 11px 14px;
  cursor: pointer; outline: none; transition: border-color .2s;
}
.field-select:focus {
  border-color: var(--c-primary);
  box-shadow: 0 0 0 3px rgba(79,70,229,.12);
}
.select-arrow {
  position: absolute; right: 14px; top: 50%;
  transform: translateY(-50%); pointer-events: none;
  color: var(--c-text3); font-size: 12px;
}

/* Slider */
.nak-header {
  display: flex; align-items: center; justify-content: space-between;
}
.nak-tag {
  font-family: var(--mono); font-size: 11px; padding: 2px 8px;
  border-radius: 6px; font-weight: 600;
}
.nak-tag.low { background: var(--c-warning-bg); color: var(--c-warning); }
.nak-tag.normal { background: var(--c-success-bg); color: var(--c-success); }
.nak-tag.high { background: var(--c-info-bg); color: var(--c-info); }
.nak-num {
  font-family: var(--mono); font-size: 16px; font-weight: 700;
  color: var(--c-primary);
}
.slider {
  width: 100%; height: 8px; appearance: none;
  background: linear-gradient(to right, var(--c-primary) 0%, var(--c-primary) var(--fill, 50%), var(--c-border) var(--fill, 50%), var(--c-border) 100%);
  border-radius: 4px; outline: none; cursor: pointer;
}
.slider::-webkit-slider-thumb {
  appearance: none; width: 22px; height: 22px; border-radius: 50%;
  background: var(--c-primary); border: 3px solid var(--c-surface);
  box-shadow: 0 2px 8px rgba(79,70,229,.4); cursor: pointer;
}
.nak-scale {
  display: flex; justify-content: space-between;
  font-family: var(--mono); font-size: 10px; color: var(--c-text3);
}

.btn-predict {
  background: linear-gradient(135deg, var(--c-primary), var(--c-primary-l));
  color: #ffffff; border: none; border-radius: 12px;
  padding: 14px; font-family: var(--sans); font-size: 15px; font-weight: 700;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  gap: 10px; box-shadow: 0 4px 14px rgba(79,70,229,.35);
  transition: all .2s; margin-top: 6px;
}
.btn-predict:hover:not(:disabled) {
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(79,70,229,.45);
}
.btn-predict:disabled { opacity: .65; cursor: not-allowed; }

.error-msg {
  background: var(--c-danger-bg); color: var(--c-danger);
  border: 1px solid rgba(220,38,38,.25); border-radius: 10px;
  padding: 12px 16px; font-size: 13px; display: flex;
  align-items: center; gap: 10px;
}

/* ═══════════════════════════════════════════
   PREDICTION RESULTS PANEL
═══════════════════════════════════════════ */
.result-in {
  display: flex; flex-direction: column; gap: 20px;
  animation: fadeIn .3s ease-out;
}
@keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

.donut-wrap {
  display: flex; justify-content: center; padding: 14px 0 6px;
}
.donut-ring { position: relative; width: 130px; height: 130px; }
.donut-svg { transform: rotate(-90deg); }
.donut-track { fill: none; stroke: var(--c-border); stroke-width: 10; }
.donut-fill {
  fill: none; stroke: url(#donutGrad); stroke-width: 10;
  stroke-linecap: round; transition: stroke-dashoffset .8s cubic-bezier(.4,0,.2,1);
}
.donut-center {
  position: absolute; inset: 0; display: flex;
  flex-direction: column; align-items: center; justify-content: center;
}
.donut-pct {
  font-family: var(--mono); font-size: 1.6rem; font-weight: 700;
  color: var(--c-text); line-height: 1;
}
.donut-sub {
  font-size: 11px; text-transform: uppercase; letter-spacing: .08em;
  color: var(--c-text3); margin-top: 3px;
}

.drug-title {
  font-size: 1.5rem; font-weight: 800; text-align: center;
  color: var(--c-text); letter-spacing: -0.02em;
}
.tag-row {
  display: flex; flex-wrap: wrap; justify-content: center; gap: 8px;
}
.tag {
  font-family: var(--mono); font-size: 11px; font-weight: 600;
  padding: 4px 12px; border-radius: 100px;
}
.tag-purple { background: rgba(79,70,229,.12); color: var(--c-primary); }
.tag-cyan   { background: rgba(6,182,212,.12); color: var(--c-accent); }
.tag-green  { background: var(--c-success-bg); color: var(--c-success); }

.clinical-actions-bar {
  display: flex; justify-content: center; gap: 10px;
}
.btn-action {
  font-family: var(--sans); font-size: 12px; font-weight: 600;
  background: var(--c-surface2); color: var(--c-text2);
  border: 1px solid var(--c-border); border-radius: 8px;
  padding: 7px 14px; cursor: pointer; display: inline-flex;
  align-items: center; gap: 6px; transition: all .2s;
}
.btn-action:hover {
  background: var(--c-surface3); color: var(--c-text);
  border-color: var(--c-primary-l);
}

.section-title {
  font-size: 12px; font-weight: 700; text-transform: uppercase;
  letter-spacing: .08em; color: var(--c-text3); margin-bottom: 8px;
}
.desc-block {
  background: var(--c-surface2); border: 1px solid var(--c-border);
  border-radius: 12px; padding: 14px 18px; font-size: 13.5px;
  color: var(--c-text2); line-height: 1.6;
}

/* Alerts box */
.alerts-list { display: flex; flex-direction: column; gap: 10px; }
.alert-card {
  border-radius: 10px; padding: 12px 14px;
  display: flex; align-items: flex-start; gap: 12px;
  border: 1px solid;
}
.alert-card.danger {
  background: var(--c-danger-bg); border-color: rgba(220,38,38,.25);
  color: var(--c-text);
}
.alert-card.warning {
  background: var(--c-warning-bg); border-color: rgba(217,119,6,.25);
  color: var(--c-text);
}
.alert-card.info {
  background: var(--c-info-bg); border-color: rgba(37,99,235,.25);
  color: var(--c-text);
}
.alert-badge {
  font-family: var(--mono); font-size: 10px; font-weight: 700;
  text-transform: uppercase; padding: 2px 7px; border-radius: 4px;
  white-space: nowrap; margin-top: 2px;
}
.alert-card.danger .alert-badge { background: var(--c-danger); color: #fff; }
.alert-card.warning .alert-badge { background: var(--c-warning); color: #fff; }
.alert-card.info .alert-badge { background: var(--c-info); color: #fff; }
.alert-content { display: flex; flex-direction: column; gap: 2px; }
.alert-title { font-size: 12.5px; font-weight: 700; color: var(--c-text); }
.alert-message { font-size: 12px; color: var(--c-text2); line-height: 1.45; }

/* Alternatives */
.alt-list { display: flex; flex-direction: column; gap: 8px; }
.alt-item {
  display: flex; align-items: center; gap: 12px;
  background: var(--c-surface2); border: 1px solid var(--c-border);
  border-radius: 10px; padding: 10px 14px;
}
.alt-rank {
  font-family: var(--mono); font-size: 12px; font-weight: 700;
  color: var(--c-text3); width: 22px;
}
.alt-info { flex: 1; min-width: 0; }
.alt-name {
  font-size: 13px; font-weight: 600; color: var(--c-text);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.alt-cls {
  font-size: 11px; color: var(--c-text3);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.alt-right { text-align: right; width: 75px; }
.alt-pct { font-family: var(--mono); font-size: 12px; font-weight: 600; color: var(--c-primary); }
.alt-bar {
  height: 4px; background: var(--c-border); border-radius: 2px;
  margin-top: 4px; overflow: hidden;
}
.alt-bar-fill {
  height: 100%; background: linear-gradient(90deg, var(--c-primary), var(--c-accent));
}

.empty {
  padding: 60px 20px; text-align: center; color: var(--c-text3);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  flex: 1;
}
.empty-icon { font-size: 42px; margin-bottom: 14px; }
.empty-title { font-size: 1.1rem; font-weight: 700; color: var(--c-text); margin-bottom: 6px; }
.empty-sub { font-size: 13px; max-width: 320px; }

.model-bar {
  background: var(--c-surface2); border-top: 1px solid var(--c-border);
  padding: 12px 24px; display: flex; justify-content: space-around;
  font-family: var(--mono); font-size: 11px; color: var(--c-text3);
}
.mbar-val { color: var(--c-primary); font-weight: 600; margin-left: 4px; }

/* ═══════════════════════════════════════════
   RECENT HISTORY
═══════════════════════════════════════════ */
.history-section {
  max-width: 1240px; margin: 0 auto 40px;
  padding: 0 24px;
}
.history-wrap {

.how-section {
  max-width: 1240px; margin: 0 auto 50px;
  padding: 0 24px; text-align: center;
}

@media print {

  .navbar, .hero, .presets-section, .btn-predict, .how-section, .site-footer, .history-section, .clinical-actions-bar {

<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect } = React;
const API = (window.location.origin && window.location.origin !== "null") ? window.location.origin : "http://localhost:5000";

/* ── Donut Chart ───────────────────────────────── */
function Donut({ pct }) {
  const R = 55, circ = 2 * Math.PI * R;
  const offset = circ - (pct / 100) * circ;
  const [displayed, setDisplayed] = useState(0);
  const [dashOffset, setDashOffset] = useState(circ);

  useEffect(() => {
    const raf = requestAnimationFrame(() => {
      setDashOffset(offset);
      let cur = 0;
      const step = pct / 60;
      const t = setInterval(() => {
        cur = Math.min(cur + step, pct);
        setDisplayed(Math.round(cur));
        if (cur >= pct) clearInterval(t);
      }, 16);
    });
    return () => cancelAnimationFrame(raf);
  }, [pct]);

  return (
    <div className="donut-ring">
      <svg className="donut-svg" width="130" height="130" viewBox="0 0 130 130">
        <defs>
          <linearGradient id="donutGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%"   stopColor="var(--c-primary)"/>
            <stop offset="100%" stopColor="var(--c-accent)"/>
          </linearGradient>
        </defs>
        <circle className="donut-track" cx="65" cy="65" r={R}/>
        <circle className="donut-fill"  cx="65" cy="65" r={R}
          strokeDasharray={circ}
          strokeDashoffset={dashOffset}/>
      </svg>
      <div className="donut-center">
        <span className="donut-pct">{displayed}%</span>
        <span className="donut-sub">Confidence</span>
      </div>
    </div>
  );
}

/* ── Alternative Row ───────────────────────────── */
function AltRow({ alt, rank }) {
  return (
    <div className="alt-item">
      <span className="alt-rank">#{rank}</span>
      <div className="alt-info">
        <div className="alt-name">{alt.drug}</div>
        <div className="alt-cls">{alt.drug_class}</div>
      </div>
      <div className="alt-right">
        <div className="alt-pct">{alt.confidence.toFixed(1)}%</div>
        <div className="alt-bar">
          <div className="alt-bar-fill" style={{ width: `${Math.min(100, Math.round(alt.confidence))}%` }}/>
        </div>
      </div>
    </div>
  );
}

/* ── Drug Catalog Modal ────────────────────────── */
function CatalogModal({ isOpen, onClose, drugs }) {
  const [query, setQuery] = useState("");
  if (!isOpen) return null;

  const filtered = (drugs || []).filter(d =>
    d.name.toLowerCase().includes(query.toLowerCase()) ||
    d.drug_class.toLowerCase().includes(query.toLowerCase()) ||
    (d.description && d.description.toLowerCase().includes(query.toLowerCase()))
  );

  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal-window" onClick={e => e.stopPropagation()}>
        <div className="modal-head">
          <div className="modal-title">💊 RxAI Drug Catalog ({drugs.length} Formulations)</div>
          <button className="btn-close" onClick={onClose}>✕</button>
        </div>
        <div className="modal-search">
          <input
            type="text"
            placeholder="Search by drug name, class, or clinical indication..."
            value={query}
            onChange={e => setQuery(e.target.value)}
            autoFocus
          />
        </div>
        <div className="modal-body">
          {filtered.length === 0 ? (
            <div className="empty">No drugs found matching "{query}"</div>
          ) : (
            filtered.map((d, i) => (
              <div className="catalog-item" key={i}>
                <div className="catalog-header">
                  <span className="catalog-name">{d.name}</span>
                  <span className="catalog-class">{d.drug_class}</span>
                </div>
                <div className="catalog-desc">{d.description}</div>
              </div>
            ))
          )}
        </div>
      </div>
    </div>
  );
}

/* ── Result Panel ──────────────────────────────── */
function ResultPanel({ result, loading, onCopyNote }) {
  const [copied, setCopied] = useState(false);

  if (loading) return (
    <div className="empty">
      <div className="empty-icon">
        <div className="spinner" style={{ width: 40, height: 40, border: "3px solid rgba(79,70,229,.2)", borderTopColor: "var(--c-primary)", borderRadius: "50%", animation: "spin 1s linear infinite" }}/>
      </div>
      <div className="empty-title">Evaluating Patient Vitals…</div>
      <div className="empty-sub">Cross-evaluating Random Forest ensemble across 49 drug classes</div>
    </div>
  );

  if (!result) return (
    <div className="empty">
      <div className="empty-icon">💊</div>
      <div className="empty-title">Ready for Clinical Evaluation</div>
      <div className="empty-sub">Select a preset patient scenario or configure vitals on the left, then click Predict Drug.</div>
    </div>
  );

  const handleCopy = () => {
    onCopyNote();
    setCopied(true);
    setTimeout(() => setCopied(false), 2000);
  };

  return (
    <div className="result-in">
      <div className="donut-wrap">
        <Donut pct={result.confidence}/>
      </div>

      <div className="drug-title">{result.drug}</div>
      <div className="tag-row">
        <span className="tag tag-purple">{result.drug_class}</span>
        {result.indication && <span className="tag tag-cyan">{result.indication}</span>}
        <span className="tag tag-green">{result.confidence.toFixed(1)}% Confidence</span>
      </div>

      <div className="clinical-actions-bar">
        <button className="btn-action" onClick={handleCopy}>
          {copied ? "✓ Copied to Clipboard" : "📋 Copy Clinical Note"}
        </button>
        <button className="btn-action" onClick={() => window.print()}>
          🖨️ Print Prescription
        </button>
      </div>

      {result.clinical_alerts && result.clinical_alerts.length > 0 && (
        <div>
          <div className="section-title">Clinical Risk Assessment & Alerts</div>
          <div className="alerts-list">
            {result.clinical_alerts.map((alert, i) => (
              <div className={`alert-card ${alert.severity}`} key={i}>
                <span className="alert-badge">{alert.badge}</span>
                <div className="alert-content">
                  <div className="alert-title">{alert.title}</div>
                  <div className="alert-message">{alert.message}</div>
                </div>
              </div>
            ))}
          </div>
        </div>
      )}

      <div>
        <div className="section-title">Clinical Pharmacology & Guidelines</div>
        <div className="desc-block">{result.description}</div>
      </div>

      <div>
        <div className="section-title">Alternative Therapeutic Candidates</div>
        <div className="alt-list">
          {result.alternatives.map((a, i) => (
            <AltRow key={i} alt={a} rank={i + 1}/>
          ))}
        </div>
      </div>
    </div>
  );
}

/* ── Main App ──────────────────────────────────── */
function App() {
  const [theme, setTheme] = useState(() => localStorage.getItem("rxai_theme") || "light");
  const [age, setAge] = useState(65);
  const [sex, setSex] = useState("M");
  const [bp, setBp] = useState("HIGH");
  const [chol, setChol] = useState("HIGH");
  const [nak, setNak] = useState(13.8);
  const [result, setResult] = useState(null);
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState("");
  const [history, setHistory] = useState(() => {
    try { return JSON.parse(localStorage.getItem("rxai_history")) || []; } catch(e) { return []; }
  });
  const [catalogOpen, setCatalogOpen] = useState(false);
  const [allDrugs, setAllDrugs] = useState([]);
  const [mInfo, setMInfo] = useState({
    test_accuracy: "96.67", cv_accuracy: "96.98", n_classes: 49, n_trees: 200
  });

  /* Sync Theme */
  useEffect(() => {
    document.documentElement.setAttribute("data-theme", theme);
    localStorage.setItem("rxai_theme", theme);
  }, [theme]);

  const toggleTheme = () => setTheme(prev => prev === "light" ? "dark" : "light");

  /* Fetch initial data */
  useEffect(() => {
    fetch(API + "/model-info")
      .then(r => r.json())
      .then(d => setMInfo(d))
      .catch(() => {});

    fetch(API + "/drugs")
      .then(r => r.json())
      .then(d => setAllDrugs(d.drugs || []))
      .catch(() => {});
  }, []);

  /* Save History */
  useEffect(() => {
    try { localStorage.setItem("rxai_history", JSON.stringify(history)); } catch(e) {}
  }, [history]);

  /* Calculate Na/K slider fill */
  const sliderFill = `${((nak - 6.0) / (38.4 - 6.0)) * 100}%`;

  /* Na/K Classification tag */
  let nakTag = { label: "Normal Range", cls: "normal" };
  if (nak < 10) nakTag = { label: "Low (Hypokalemia Risk)", cls: "low" };
  else if (nak > 24) nakTag = { label: "High Na / Low K", cls: "high" };

  /* Preset Loader */
  const loadPreset = (p) => {
    setAge(p.age);
    setSex(p.sex);
    setBp(p.bp);
    setChol(p.cholesterol);
    setNak(p.na_to_k);
  };

  /* Random Patient Generator */
  const randomizePatient = () => {
    const randomAge = Math.floor(Math.random() * (85 - 18 + 1)) + 18;
    const randomSex = Math.random() > 0.5 ? "M" : "F";
    const bpOptions = ["HIGH", "NORMAL", "LOW"];
    const randomBp = bpOptions[Math.floor(Math.random() * bpOptions.length)];
    const cholOptions = ["HIGH", "NORMAL"];
    const randomChol = cholOptions[Math.floor(Math.random() * cholOptions.length)];
    const randomNak = parseFloat((Math.random() * (35 - 8) + 8).toFixed(1));

    setAge(randomAge);
    setSex(randomSex);
    setBp(randomBp);
    setChol(randomChol);
    setNak(randomNak);
  };

  /* Predict Handler */
  async function handlePredict() {
    setError("");
    const ageNum = parseFloat(age);
    if (!age || isNaN(ageNum) || ageNum < 1 || ageNum > 120) {
      setError("Please enter a valid patient age between 1 and 120.");
      return;
    }

    setLoading(true);
    setResult(null);
    try {
      const res = await fetch(API + "/predict", {
        method : "POST",
        headers: { "Content-Type": "application/json" },
        body   : JSON.stringify({
          age: ageNum, sex, bp, cholesterol: chol, na_to_k: parseFloat(nak)
        }),
      });
      const data = await res.json();
      if (data.error) throw new Error(data.error);

      setResult(data);
      if (data.model_info) setMInfo(data.model_info);

      // Append to history
      setHistory(prev => {
        const item = {
          drug: data.drug,
          confidence: data.confidence,
          age: ageNum,
          sex,
          bp,
          chol,
          nak: parseFloat(nak),
          time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        };
        const updated = [item, ...prev.filter(h => h.drug !== data.drug || h.age !== ageNum)].slice(0, 5);
        return updated;
      });

    } catch (e) {
      setError(
        e.message.includes("fetch") || e.message.includes("Failed")
          ? "Cannot connect to Flask backend. Make sure app.py is running on port 5000."
          : e.message
      );
    } finally {
      setLoading(false);
    }
  }

  /* Copy Clinical Note */
  const copyClinicalNote = () => {
    if (!result) return;
    const text = `========================================
RxAI CLINICAL DECISION SUPPORT MEMO
Generated: ${new Date().toLocaleString()}
========================================
PATIENT PARAMETERS:
- Age: ${age} years | Biological Sex: ${sex === "M" ? "Male" : "Female"}
- Blood Pressure : ${bp}
- Cholesterol    : ${chol}
- Na/K Ratio     : ${nak} (${nakTag.label})

PRIMARY RECOMMENDATION:
- Drug           : ${result.drug}
- Confidence     : ${result.confidence.toFixed(1)}%
- Drug Class     : ${result.drug_class}
- Indication     : ${result.indication || "N/A"}

CLINICAL DESCRIPTION:
${result.description}

CLINICAL ALERTS:
${(result.clinical_alerts || []).map(a => `* [${a.badge}] ${a.title}: ${a.message}`).join("\n") || "No critical contraindications identified."}

TOP ALTERNATIVES:
${result.alternatives.map((a, i) => `${i + 1}. ${a.drug} (${a.drug_class}) - ${a.confidence.toFixed(1)}%`).join("\n")}
========================================
Disclaimer: Educational clinical decision support prototype.`;

    navigator.clipboard.writeText(text);
  };

  return (
    <>
      {/* ── NAVBAR ── */}
      <nav className="navbar">
        <div className="navbar-inner">
          <div className="logo">
            <div className="logo-icon">💊</div>
            <div className="logo-text">Rx<span>AI</span></div>
          </div>
          <div className="nav-actions">
            <button className="btn-nav" onClick={() => setCatalogOpen(true)}>
              📚 Drug Catalog ({allDrugs.length || 49})
            </button>
            <div className="navbar-badge">
              Random Forest · {mInfo.test_accuracy}% Acc
            </div>
            <button className="theme-toggle-btn" onClick={toggleTheme} title="Toggle Dark/Light Mode">
              {theme === "light" ? "🌙" : "☀️"}
            </button>
          </div>
        </div>
      </nav>

      {/* ── HERO ── */}
      <div className="hero">
        <div className="hero-pill">
          <div className="hero-pill-dot"/>
          Clinical AI Decision Support System
        </div>
        <h1>AI-Assisted <em>Therapeutic Drug</em><br/>Prediction System</h1>
        <p>
          State-of-the-art Random Forest classifier trained on clinical records.
          Instant therapeutic recommendations, dosage insights, and risk assessments.
        </p>
        <div className="stat-row">
          <div className="stat-item">
            <span className="stat-val">{mInfo.test_accuracy}%</span>
            <span className="stat-lbl">Test Accuracy</span>
          </div>
          <div className="stat-item">
            <span className="stat-val">{mInfo.cv_accuracy}%</span>
            <span className="stat-lbl">5-Fold CV</span>
          </div>
          <div className="stat-item">
            <span className="stat-val">{mInfo.n_classes || 49}</span>
            <span className="stat-lbl">Drug Formulations</span>
          </div>
          <div className="stat-item">
            <span className="stat-val">1,200</span>
            <span className="stat-lbl">Clinical Records</span>
          </div>
        </div>
      </div>

      {/* ── PRESETS CHIP BAR ── */}
      <div className="presets-section">
        <div className="presets-wrapper">
          <span className="presets-label">⚡ Benchmark Presets:</span>
          <button className="preset-chip" onClick={() => loadPreset({ age: 65, sex: "M", bp: "HIGH", cholesterol: "HIGH", na_to_k: 13.8 })}>
            🩺 Hypertensive Senior (65 M)
          </button>
          <button className="preset-chip" onClick={() => loadPreset({ age: 24, sex: "F", bp: "LOW", cholesterol: "NORMAL", na_to_k: 28.5 })}>
            👩 Young Hypotensive (24 F)
          </button>
          <button className="preset-chip" onClick={() => loadPreset({ age: 52, sex: "M", bp: "HIGH", cholesterol: "NORMAL", na_to_k: 9.4 })}>
            🏃 Metabolic Risk (52 M)
          </button>
          <button className="preset-chip" onClick={() => loadPreset({ age: 70, sex: "F", bp: "NORMAL", cholesterol: "HIGH", na_to_k: 17.2 })}>
            👵 Cardiac Senior (70 F)
          </button>
          <button className="preset-chip" onClick={() => loadPreset({ age: 38, sex: "M", bp: "LOW", cholesterol: "NORMAL", na_to_k: 34.2 })}>
            💧 Electrolyte Imbalance (38 M)
          </button>
          <button className="preset-chip random" onClick={randomizePatient}>
            🎲 Randomize Vitals
          </button>
        </div>
      </div>

      {/* ── MAIN WORKSPACE ── */}
      <div className="page-wrap">

        {/* INPUT CARD */}
        <div className="card">
          <div className="card-head">
            <div className="card-head-left">
              <div className="card-head-icon">⚕️</div>
              <div>
                <div className="card-head-title">Patient Clinical Parameters</div>
                <div className="card-head-sub">5 diagnostic features · verified input range</div>
              </div>
            </div>
          </div>

          <div className="card-body">
            {/* Age + Sex */}
            <div className="field-row">
              <div className="field">
                <label className="field-label">Age (Years)</label>
                <input
                  className="field-input"
                  type="number" min="1" max="120"
                  value={age}
                  onChange={e => setAge(e.target.value)}
                  onKeyDown={e => e.key === "Enter" && handlePredict()}
                  placeholder="e.g. 55"
                />
              </div>
              <div className="field">
                <label className="field-label">Biological Sex</label>
                <div className="toggle-row">
                  <button className={`toggle-btn${sex === "M" ? " on" : ""}`} onClick={() => setSex("M")}>
                    ♂ Male
                  </button>
                  <button className={`toggle-btn${sex === "F" ? " on" : ""}`} onClick={() => setSex("F")}>
                    ♀ Female
                  </button>
                </div>
              </div>
            </div>

            {/* BP + Cholesterol */}
            <div className="field-row">
              <div className="field">
                <label className="field-label">Blood Pressure (BP)</label>
                <div className="select-wrap">
                  <select className="field-select" value={bp} onChange={e => setBp(e.target.value)}>
                    <option value="HIGH">HIGH (Hypertension)</option>
                    <option value="NORMAL">NORMAL (Normotensive)</option>
                    <option value="LOW">LOW (Hypotension)</option>
                  </select>
                  <span className="select-arrow">▾</span>
                </div>
              </div>
              <div className="field">
                <label className="field-label">Serum Cholesterol</label>
                <div className="select-wrap">
                  <select className="field-select" value={chol} onChange={e => setChol(e.target.value)}>
                    <option value="HIGH">HIGH (Hyperlipidemia)</option>
                    <option value="NORMAL">NORMAL (Desirable)</option>
                  </select>
                  <span className="select-arrow">▾</span>
                </div>
              </div>
            </div>

            {/* Na/K Ratio Slider */}
            <div className="field">
              <div className="nak-header">
                <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                  <label className="field-label" style={{ margin: 0 }}>Na / K Ratio</label>
                  <span className={`nak-tag ${nakTag.cls}`}>{nakTag.label}</span>
                </div>
                <span className="nak-num">{parseFloat(nak).toFixed(1)}</span>
              </div>
              <input
                className="slider"
                type="range" min="6.0" max="38.4" step="0.1"
                value={nak}
                style={{ "--fill": sliderFill }}
                onChange={e => setNak(e.target.value)}
              />
              <div className="nak-scale">
                <span>6.0 (K-sparing threshold)</span>
                <span>15.0 (Median)</span>
                <span>38.4 (High Na)</span>
              </div>
            </div>

            <button className="btn-predict" disabled={loading} onClick={handlePredict}>
              {loading ? "⚙️ Evaluating Clinical Model…" : "🔬 Predict Optimal Drug"}
            </button>

            {error && (
              <div className="error-msg">
                <span>⚠</span>
                <span>{error}</span>
              </div>
            )}
          </div>
        </div>

        {/* RESULTS CARD */}
        <div className="card">
          <div className="card-head">
            <div className="card-head-left">
              <div className="card-head-icon">📋</div>
              <div>
                <div className="card-head-title">Clinical Decision Output</div>
                <div className="card-head-sub">
                  {result
                    ? `Inference Complete · ${result.confidence.toFixed(1)}% Confidence`
                    : "Awaiting parameters · click Predict Drug"}
                </div>
              </div>
            </div>
          </div>

          <div className="card-body">
            <ResultPanel result={result} loading={loading} onCopyNote={copyClinicalNote}/>
          </div>

          <div className="model-bar">
            <div>Model <span className="mbar-val">RandomForest</span></div>
            <div>Test Acc <span className="mbar-val">{mInfo.test_accuracy}%</span></div>
            <div>CV Acc <span className="mbar-val">{mInfo.cv_accuracy}%</span></div>
            <div>Classes <span className="mbar-val">{mInfo.n_classes || 49}</span></div>
          </div>
        </div>
      </div>

      {/* ── RECENT PREDICTIONS HISTORY ── */}
      {history.length > 0 && (
        <div className="history-section">
          <div className="history-wrap">
            <span className="presets-label">🕒 Recent Sessions:</span>
            {history.map((h, idx) => (
              <div
                className="history-chip"
                key={idx}
                onClick={() => {
                  loadPreset({ age: h.age, sex: h.sex, bp: h.bp, cholesterol: h.chol, na_to_k: h.nak });
                  handlePredict();
                }}
                title="Click to reload this patient scenario"
              >
                <span>{h.age}{h.sex}</span>
                <span className="history-drug">{h.drug}</span>
                <span className="history-conf">{h.confidence.toFixed(0)}%</span>
              </div>
            ))}
            <button
              className="btn-nav"
              style={{ padding: "4px 10px", fontSize: 11, marginLeft: "auto" }}
              onClick={() => setHistory([])}
            >
              Clear
            </button>
          </div>
        </div>
      )}

      {/* ── HOW IT WORKS ── */}
      <div className="how-section">
        <h2 className="how-title">Clinical Decision Architecture</h2>
        <p className="how-sub">// multi_stage_pipeline · inference architecture</p>
        <div className="how-grid">
          {[
            ["01", "Biomarker Ingestion", "Captures vital clinical parameters (Age, Sex, BP, Cholesterol, Na/K ratio) validated against clinical distribution thresholds."],
            ["02", "Feature Transformation", "Categorical dimensions are encoded with calibrated label mappings; continuous biomarker features pass normalized directly to the ensemble."],
            ["03", "Random Forest Ensemble", "200-estimator bagging ensemble models multi-class decision boundaries across 49 drug classes with 5-fold stratified cross-validation."],
            ["04", "Clinical Rule Layer", "Synthesizes probabilistic predictions with FDA contraindications, geriatric precautions, and electrolyte risk stratification alerts."]
          ].map(([n, title, desc]) => (
            <div className="how-card" key={n}>
              <div className="how-num">{n} / PIPELINE</div>
              <h3>{title}</h3>
              <p>{desc}</p>
            </div>
          ))}
        </div>
      </div>

      {/* ── FOOTER ── */}
      <footer className="site-footer">
        <div className="site-footer-logo">RxAI Decision Support</div>
        <div className="site-footer-note">
          Designed by Vamshi Yadav Kodi · Random Forest ML · 49 Formulations · Educational Decision Support System
        </div>
      </footer>

      {/* ── MODAL: 49 DRUGS CATALOG ── */}
      <CatalogModal
        isOpen={catalogOpen}
        onClose={() => setCatalogOpen(false)}
        drugs={allDrugs}
      />
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
